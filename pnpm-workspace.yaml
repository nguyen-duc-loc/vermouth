# Two Node packages: the web app, and the repository root, which owns nothing but
# the browser type generator. The Go half is covered by go.work.
packages:
  - web

# openapi-typescript drives the TypeScript compiler API to emit web/src/api/schema.d.ts
# (STK-10). TypeScript 7 is the native compiler and ships no JS compiler API, so the
# generator gets its own TypeScript 6 here while tsc -b type checks on 7. The generator
# lives in the root package precisely so this version is the one it resolves: a peer
# dependency is satisfied by the package that asks for it, so inside web it would always
# get web's TypeScript 7 no matter what this override says.
overrides:
  openapi-typescript>typescript: 6.0.3
