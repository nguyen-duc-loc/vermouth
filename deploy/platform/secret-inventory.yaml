schemaVersion: 1
hashSchema: vermouth-secret-v1
foundation:
  postgres-identity:
    nameBase: postgres-identity-bootstrap
    keys:
      POSTGRES_PASSWORD:
        source: POSTGRES_PASSWORD
        generation: required
    consumers: [postgres-identity]
  postgres-teaching:
    nameBase: postgres-teaching-bootstrap
    keys:
      POSTGRES_PASSWORD:
        source: POSTGRES_PASSWORD
        generation: required
    consumers: [postgres-teaching]
  postgres-billing:
    nameBase: postgres-billing-bootstrap
    keys:
      POSTGRES_PASSWORD:
        source: POSTGRES_PASSWORD
        generation: required
    consumers: [postgres-billing]
  postgres-notifications:
    nameBase: postgres-notifications-bootstrap
    keys:
      POSTGRES_PASSWORD:
        source: POSTGRES_PASSWORD
        generation: required
    consumers: [postgres-notifications]
  garage:
    nameBase: garage-bootstrap
    keys:
      GARAGE_RPC_SECRET:
        source: GARAGE_RPC_SECRET
        generation: random-hex-32
      GARAGE_ADMIN_TOKEN:
        source: GARAGE_ADMIN_TOKEN
        generation: random-hex-32
    consumers: [garage, garage-init]
  billing-s3:
    nameBase: billing-s3-bootstrap
    keys:
      BILLING_S3_ACCESS_KEY_ID:
        source: BILLING_S3_ACCESS_KEY_ID
        generation: garage-key-id
      BILLING_S3_SECRET_ACCESS_KEY:
        source: BILLING_S3_SECRET_ACCESS_KEY
        generation: random-hex-32
    consumers: [garage-init, billing-runtime]
runtime:
  gateway:
    nameBase: gateway-runtime
    keys:
      TOKEN_PUBLIC_KEYS:
        source: TOKEN_PUBLIC_KEYS
        generation: signing-set
    consumers: [gateway]
  identity:
    nameBase: identity-runtime
    database:
      serviceDNS: postgres-identity
      port: 5432
      database: vermouth_identity
      role: vermouth_identity
      passwordSecret: postgres-identity-bootstrap
      passwordKey: POSTGRES_PASSWORD
      urlTemplate: postgres://{role}:{password}@{serviceDNS}:{port}/{database}?sslmode=disable
    keys:
      IDENTITY_DATABASE_URL:
        source: database
        generation: database-url
      TOKEN_PUBLIC_KEYS:
        source: TOKEN_PUBLIC_KEYS
        generation: signing-set
      IDENTITY_TOKEN_KID:
        source: IDENTITY_TOKEN_KID
        generation: signing-set
      IDENTITY_TOKEN_PRIVATE_KEY:
        source: IDENTITY_TOKEN_PRIVATE_KEY
        generation: signing-set
      IDENTITY_GOOGLE_CLIENT_ID:
        source: IDENTITY_GOOGLE_CLIENT_ID
        generation: google-enabled
        optional: true
      IDENTITY_GOOGLE_CLIENT_SECRET:
        source: IDENTITY_GOOGLE_CLIENT_SECRET
        generation: google-enabled
        optional: true
    consumers: [identity, migrate-identity, devtoken]
  teaching:
    nameBase: teaching-runtime
    database:
      serviceDNS: postgres-teaching
      port: 5432
      database: vermouth_teaching
      role: vermouth_teaching
      passwordSecret: postgres-teaching-bootstrap
      passwordKey: POSTGRES_PASSWORD
      urlTemplate: postgres://{role}:{password}@{serviceDNS}:{port}/{database}?sslmode=disable
    keys:
      TEACHING_DATABASE_URL:
        source: database
        generation: database-url
      TOKEN_PUBLIC_KEYS:
        source: TOKEN_PUBLIC_KEYS
        generation: signing-set
    consumers: [teaching, migrate-teaching]
  billing:
    nameBase: billing-runtime
    database:
      serviceDNS: postgres-billing
      port: 5432
      database: vermouth_billing
      role: vermouth_billing
      passwordSecret: postgres-billing-bootstrap
      passwordKey: POSTGRES_PASSWORD
      urlTemplate: postgres://{role}:{password}@{serviceDNS}:{port}/{database}?sslmode=disable
    keys:
      BILLING_DATABASE_URL:
        source: database
        generation: database-url
      TOKEN_PUBLIC_KEYS:
        source: TOKEN_PUBLIC_KEYS
        generation: signing-set
      BILLING_S3_ACCESS_KEY_ID:
        source: BILLING_S3_ACCESS_KEY_ID
        generation: foundation-copy
      BILLING_S3_SECRET_ACCESS_KEY:
        source: BILLING_S3_SECRET_ACCESS_KEY
        generation: foundation-copy
    consumers: [billing, migrate-billing]
  notifications:
    nameBase: notifications-runtime
    database:
      serviceDNS: postgres-notifications
      port: 5432
      database: vermouth_notifications
      role: vermouth_notifications
      passwordSecret: postgres-notifications-bootstrap
      passwordKey: POSTGRES_PASSWORD
      urlTemplate: postgres://{role}:{password}@{serviceDNS}:{port}/{database}?sslmode=disable
    keys:
      NOTIFICATIONS_DATABASE_URL:
        source: database
        generation: database-url
      TOKEN_PUBLIC_KEYS:
        source: TOKEN_PUBLIC_KEYS
        generation: signing-set
    consumers: [notifications, migrate-notifications]
