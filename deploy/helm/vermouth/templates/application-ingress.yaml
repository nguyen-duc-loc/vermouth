{{- if .Values.application.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vermouth
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "ingress") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: vermouth.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /config.json
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
{{- end }}
