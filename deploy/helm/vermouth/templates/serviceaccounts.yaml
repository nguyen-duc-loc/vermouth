{{- if .Values.foundation.enabled }}
{{- range $component := list "postgres-identity" "postgres-teaching" "postgres-billing" "postgres-notifications" "redpanda" "garage" "migrate-identity" "migrate-teaching" "migrate-billing" "migrate-notifications" "garage-init" "devtoken" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component }}
  labels:
    {{- include "vermouth.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
automountServiceAccountToken: false
{{- end }}
{{- end }}
{{- if .Values.application.enabled }}
{{- range $component := list "gateway" "identity" "teaching" "billing" "notifications" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $component }}
  labels:
    {{- include "vermouth.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
automountServiceAccountToken: false
{{- end }}
{{- end }}
