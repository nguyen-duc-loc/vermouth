{{- if .Values.foundation.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "garage") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "garage:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.garage.localhost"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
{{- end }}
{{- if .Values.application.enabled }}
{{- $common := dict
  "LOG_LEVEL" .Values.config.logLevel
  "BROKER_SEEDS" .Values.config.brokerSeeds
  "TOPIC_PARTITIONS" .Values.config.topicPartitions
  "RELAY_INTERVAL" .Values.config.relayInterval
  "CONSUMER_RETRY_MAX" .Values.config.consumerRetryMax
  "CONSUMER_RETRY_BASE_DELAY" .Values.config.consumerRetryBaseDelay
}}
{{- range $name, $port := dict "identity" "8081" "teaching" "8082" "billing" "8083" "notifications" "8084" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "vermouth.componentLabels" (dict "root" $ "component" $name) | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
data:
  {{- range $key, $value := $common }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{ upper $name }}_HTTP_ADDR: {{ printf ":%s" $port | quote }}
  {{- if eq $name "identity" }}
  VERMOUTH_GOOGLE_AUTH_ENABLED: {{ $.Values.config.googleAuthEnabled | quote }}
  IDENTITY_GOOGLE_REDIRECT_URL: {{ $.Values.config.identityGoogleRedirectURL | quote }}
  IDENTITY_APP_URL: {{ $.Values.config.identityAppURL | quote }}
  IDENTITY_SIGNUP_ALLOWLIST: {{ $.Values.config.identitySignupAllowlist | quote }}
  IDENTITY_REFRESH_TTL: {{ $.Values.config.identityRefreshTTL | quote }}
  IDENTITY_TOKEN_TTL: {{ $.Values.config.identityTokenTTL | quote }}
  IDENTITY_REFRESH_GRACE: {{ $.Values.config.identityRefreshGrace | quote }}
  IDENTITY_SWEEP_INTERVAL: {{ $.Values.config.identitySweepInterval | quote }}
  IDENTITY_COOKIE_SECURE: {{ $.Values.config.identityCookieSecure | quote }}
  {{- end }}
  {{- if eq $name "billing" }}
  BILLING_S3_ENDPOINT: {{ $.Values.config.billingS3Endpoint | quote }}
  BILLING_S3_REGION: {{ $.Values.config.billingS3Region | quote }}
  BILLING_S3_BUCKET: {{ $.Values.config.billingS3Bucket | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GATEWAY_HTTP_ADDR: ":8080"
  GATEWAY_IDENTITY_URL: http://identity:8081
  GATEWAY_TEACHING_URL: http://teaching:8082
  GATEWAY_BILLING_URL: http://billing:8083
  GATEWAY_NOTIFICATIONS_URL: http://notifications:8084
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-runtime-config
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
data:
  config.json: |
    {"schemaVersion":1,"environment":"local","googleAuthEnabled":{{ .Values.config.googleAuthEnabled }},"apiBasePath":"/api"}
{{- end }}
