{{- if .Values.application.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
spec:
  selector:
    app.kubernetes.io/name: vermouth
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "vermouth.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vermouth
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        vermouth.dev/config-sha256: {{ toJson .Values.config | sha256sum }}
      labels:
        app.kubernetes.io/name: vermouth
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        {{- include "vermouth.podSecurity" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: {{ include "vermouth.requireImage" (dict "name" "web" "image" .Values.images.web) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "vermouth.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-config
          configMap:
            name: web-runtime-config
        - name: cache
          emptyDir:
            sizeLimit: 32Mi
        - name: run
          emptyDir:
            sizeLimit: 4Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
