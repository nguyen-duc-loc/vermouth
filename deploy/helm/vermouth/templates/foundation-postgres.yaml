{{- if .Values.foundation.enabled }}
{{- $matrix := .Files.Get "files/workload-matrix.yaml" | fromYaml }}
{{- $workload := index $matrix.workloads "postgres" }}
{{- range $name := list "identity" "teaching" "billing" "notifications" }}
{{- $component := printf "postgres-%s" $name }}
{{- $role := printf "vermouth_%s" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}
  labels:
    {{- include "vermouth.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vermouth
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $component }}
  labels:
    {{- include "vermouth.componentLabels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    vermouth.dev/decision: spec-0005
spec:
  serviceName: {{ $component }}
  replicas: {{ $workload.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vermouth
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vermouth
        app.kubernetes.io/component: {{ $component }}
    spec:
      serviceAccountName: {{ $component }}
      {{- include "vermouth.imagePullSecrets" $ | nindent 6 }}
      automountServiceAccountToken: {{ $workload.automountServiceAccountToken }}
      securityContext:
        {{- include "vermouth.podSecurity" $ | nindent 8 }}
        runAsUser: {{ $workload.runAsUser }}
        runAsGroup: {{ $workload.runAsGroup }}
        fsGroup: {{ $workload.fsGroup }}
        fsGroupChangePolicy: OnRootMismatch
      {{- include "vermouth.storageGuard" $ | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "vermouth.requireImage" (dict "name" "postgres" "image" $.Values.images.postgres) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "vermouth.containerSecurity" $ | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ $role }}
            - name: POSTGRES_DB
              value: {{ $role }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ index $.Values.secrets.postgres $name }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ $role }}, -d, {{ $role }}]
            initialDelaySeconds: 5
            periodSeconds: {{ $workload.readiness.periodSeconds }}
            timeoutSeconds: {{ $workload.readiness.timeoutSeconds }}
            failureThreshold: {{ $workload.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command: [pg_isready, -U, {{ $role }}, -d, {{ $role }}]
            initialDelaySeconds: 15
            periodSeconds: {{ $workload.liveness.periodSeconds }}
            timeoutSeconds: {{ $workload.liveness.timeoutSeconds }}
            failureThreshold: {{ $workload.liveness.failureThreshold }}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "vermouth.storageGuardVolume" $ | nindent 8 }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $component }}
        - name: run
          emptyDir:
            medium: {{ (index $workload.writableMounts 1).medium }}
            sizeLimit: {{ (index $workload.writableMounts 1).sizeLimit }}
        - name: tmp
          emptyDir:
            medium: {{ (index $workload.writableMounts 2).medium }}
            sizeLimit: {{ (index $workload.writableMounts 2).sizeLimit }}
{{- end }}
{{- end }}
