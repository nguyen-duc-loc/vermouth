openapi: 3.1.0
info:
  title: Vermouth gateway
  version: 0.1.0
  description: |
    The single description of the gateway surface (STK-10). The gateway's Go
    request and response types are generated from this document with
    oapi-codegen, and the browser's types with openapi-typescript. A hand
    written client type for a gateway endpoint is not allowed.

    Only the gateway is described here. Services are reached by the gateway
    alone (INV-1), so their endpoints are not a public surface.

    The four auth endpoints are unauthenticated because they are what produces
    a token. Everything else under /api/ needs one. The teaching endpoints are
    the first real product thread through the gateway.
servers:
  - url: http://localhost:8080
    description: local development

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness of the gateway itself
      security: []
      responses:
        "200":
          description: The gateway is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ready:
    get:
      operationId: getReady
      summary: Readiness of the gateway and every service behind it
      security: []
      responses:
        "200":
          description: Every service answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one service did not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"

  /api/auth/google/start:
    get:
      operationId: startGoogleSignIn
      summary: Begin Google sign in
      description: |
        Writes the in flight sign in (its state, PKCE verifier, nonce, and the
        hash of an independent browser binding cookie) and redirects the browser
        to Google. The browser follows this as a plain link, so it is a GET;
        nothing here needs a token, because this is what eventually produces one
        (spec 0004).
      security: []
      parameters:
        - name: tz
          in: query
          required: false
          description: |
            The browser's IANA timezone name, carried onto the tutor created by
            the callback. Anything time.LoadLocation refuses falls back to
            Asia/Ho_Chi_Minh.
          schema:
            type: string
            examples: ["Asia/Ho_Chi_Minh"]
        - name: lang
          in: query
          required: false
          description: The browser's language. Anything else falls back to vi.
          schema:
            type: string
            enum: [vi, en]
        - name: redirect_to
          in: query
          required: false
          description: |
            Where in the app to land after signing in. Kept only when it is a
            clean relative path and query with one leading slash, no fragment,
            controls, backslash, scheme, or host.
          schema:
            type: string
            examples: ["/"]
      responses:
        "302":
          description: |
            Google's authorize URL, or /signin?error=provider_error when the
            attempt could not be written. A rate limited request instead uses
            /signin?error=rate_limited and carries Retry-After plus no-store.
          headers:
            Location:
              required: true
              schema:
                type: string
            Retry-After:
              description: Whole seconds until every applicable rate budget can admit one request.
              required: false
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              description: Present as no-store on a rate limited redirect.
              required: false
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: The short lived HttpOnly browser binding cookie.
              schema:
                type: string
        "503":
          description: Google sign in is disabled in this local environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/google/callback:
    get:
      operationId: completeGoogleSignIn
      summary: Complete Google sign in and start a session
      description: |
        Google sends the browser here. The matching state and browser binding
        are required, then the code is exchanged and the ID token validated by
        identity, which holds the client secret. A first sign in creates the
        tutor and its identity.tutor.registered event in one transaction. The
        answer carries no access token on purpose: it sets the refresh cookie and
        lands the browser in the app, which then calls /api/auth/refresh, so a
        token never appears in a URL or in history.
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Google's authorization code. Absent when Google reports an error instead.
          schema:
            type: string
        - name: state
          in: query
          required: false
          description: The single use state from the start call.
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by Google when the tutor cancelled or the exchange cannot proceed.
          schema:
            type: string
      responses:
        "302":
          description: |
            The app, or /signin?error=<code> with one of not_allowed,
            email_conflict, cancelled, expired_state, provider_error or
            rate_limited. A rate limited redirect carries Retry-After plus
            no-store.
          headers:
            Location:
              required: true
              schema:
                type: string
            Retry-After:
              description: Whole seconds until every applicable rate budget can admit one request.
              required: false
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              description: Present as no-store on a rate limited redirect.
              required: false
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: |
                The browser binding clear, plus the rotating refresh token on
                success. Both are HttpOnly and repeat their original paths.
              schema:
                type: string
        "503":
          description: Google sign in is disabled in this local environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/refresh:
    post:
      operationId: refreshSession
      summary: Exchange the refresh cookie for an access token
      description: |
        The one path to an access token, used both after the callback and on
        every boot, which is what makes a reload survive without a Google round
        trip. The cookie rotates on every call: presenting an already rotated
        token later than the grace window revokes the whole session family.

        It is a POST and requires Origin to equal IDENTITY_APP_URL exactly.
        SameSite=Lax on the cookie is a supporting cross site protection.
      security: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: |
            Supplied automatically by the browser and required by identity. It
            must equal the configured app origin exactly.
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: A fresh access token, and a rotated cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: |
            The refresh cookie is missing, unknown, expired, revoked, or reused
            outside the grace window. The response clears that cookie.
          headers:
            Set-Cookie:
              description: Clears the refresh cookie with the same path and flags.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/signout:
    post:
      operationId: signOut
      summary: End the session
      description: |
        Revokes the locked session family and clears the cookie. It answers 204
        whether or not the cookie named a live session, because signing out
        twice is not an error. Origin must equal IDENTITY_APP_URL exactly.
      security: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: |
            Supplied automatically by the browser and required by identity. It
            must equal the configured app origin exactly.
          schema:
            type: string
            format: uri
      responses:
        "204":
          description: The session is over and the refresh cookie is cleared
          headers:
            Set-Cookie:
              description: Clears the refresh cookie with the same path and flags.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/me:
    get:
      operationId: getMe
      summary: The signed in tutor
      description: |
        The tutor comes from the sub claim of the verified token and from
        nothing else (INV-8).
      responses:
        "200":
          description: The signed in tutor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tutor"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/classes:
    post:
      operationId: createClass
      summary: Create a class with its first session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassRequest"
      responses:
        "200":
          description: The original class and first session for a safe retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClassResponse"
        "201":
          description: The class and first session were created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateClassResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/classes/{class_id}/schedule:
    put:
      operationId: putClassSchedule
      summary: Create the first weekly schedule for an existing class
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutScheduleRequest"
      responses:
        "200":
          description: A replacement rule was created or the original response was replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutScheduleResponse"
        "201":
          description: The first retained schedule rule and concrete sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/classes/{class_id}/rates:
    get:
      operationId: getClassRates
      summary: Read authoritative current rate and projected dated history
      parameters:
        - $ref: "#/components/parameters/ClassId"
      responses:
        "200":
          description: Current rate, allowed correction range, and complete dated history
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRates"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/classes/{class_id}/rates/{effective_date}:
    put:
      operationId: putClassRate
      summary: Create or correct one dated class rate
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - name: effective_date
          in: path
          required: true
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutClassRateRequest"
      responses:
        "200":
          description: The committed dated rate or its original retry response
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutClassRateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/classes/{class_id}/schedule/end:
    post:
      operationId: endClassSchedule
      summary: End the latest retained weekly schedule
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndScheduleRequest"
      responses:
        "200":
          description: The schedule was ended or the original response was replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/sessions/{session_id}/move:
    post:
      operationId: moveSession
      summary: Move one active session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSessionRequest"
      responses:
        "200":
          description: The moved canonical session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/sessions/{session_id}/cancel:
    post:
      operationId: cancelSession
      summary: Cancel one active session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionVersionRequest"
      responses:
        "200":
          description: The cancelled canonical session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/sessions/{session_id}/restore:
    post:
      operationId: restoreSession
      summary: Restore one tutor cancelled session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionVersionRequest"
      responses:
        "200":
          description: The restored canonical session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/schedule:
    get:
      operationId: getSchedule
      summary: Read one bounded tutor calendar window
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: through
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: class_id
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: include_replaced
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: history_limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - name: history_cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The owned classes, rules, and concrete sessions in the display window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/students:
    get:
      operationId: listStudents
      summary: Search active students
      parameters:
        - $ref: "#/components/parameters/StudentQuery"
        - $ref: "#/components/parameters/StudentCursor"
      responses:
        "200":
          description: One stable cursor page of active students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createStudent
      summary: Register a student
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "200":
          description: The original student for a safe retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "201":
          description: The student was registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/students/{student_id}:
    get:
      operationId: getStudent
      summary: Read one active student and class history
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: The active student and retained memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStudent
      summary: Edit an active student using the last read timestamp
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: The canonical updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: archiveStudent
      summary: Archive an active student with no current class membership
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: The student was archived or the exact command was replayed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/classes/{class_id}/roster:
    get:
      operationId: getClassRoster
      summary: Read an owned class roster on a local date
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/RosterDate"
      responses:
        "200":
          description: The owned class and students covered by the resolved date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRoster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: changeClassRoster
      summary: Apply one atomic dated roster delta
      parameters:
        - $ref: "#/components/parameters/ClassId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRosterRequest"
      responses:
        "200":
          description: The canonical roster on the change date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassRoster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/sessions/{session_id}/attendance:
    get:
      operationId: getSessionAttendance
      summary: Read one whole roster attendance sheet
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The coherent session, roster, saved states, and revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSheet"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveSessionAttendance
      summary: Save one complete whole roster attendance pass
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAttendanceRequest"
      responses:
        "200":
          description: The complete canonical saved pass
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSave"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/invoice-profile:
    get:
      operationId: getInvoiceProfile
      summary: Read the signed in tutor's invoice identity and bank details
      responses:
        "200":
          description: The canonical private invoice profile
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putInvoiceProfile
      summary: Save the signed in tutor's complete editable invoice profile representation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutInvoiceProfileRequest"
      responses:
        "200":
          description: The normalized canonical profile after the save
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/banks:
    get:
      operationId: getBanks
      summary: Read the active committed Vietnamese bank catalog
      responses:
        "200":
          description: Every active catalog entry in stable payment code order
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: "private, max-age=86400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankCatalog"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/billing-periods/default:
    get:
      operationId: getBillingPeriodDefault
      summary: Read the server derived most recent completed month
      responses:
        "200":
          description: Verified timezone and default completed period
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriodDefault"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/billing-periods/{year}/{month}:
    get:
      operationId: getBillingPeriod
      summary: Read an unissued month or its immutable issued run
      parameters:
        - $ref: "#/components/parameters/BillingYear"
        - $ref: "#/components/parameters/BillingMonth"
      responses:
        "200":
          description: The current authoritative period state
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPeriodState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/billing-periods/{year}/{month}/preview:
    post:
      operationId: previewBillingPeriod
      summary: Calculate one completed month after proving projection readiness
      parameters:
        - $ref: "#/components/parameters/BillingYear"
        - $ref: "#/components/parameters/BillingMonth"
      responses:
        "200":
          description: Ready, blocked, empty, or already issued month
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ProjectionUnavailable"

  /api/billing-periods/{year}/{month}/issue:
    post:
      operationId: issueBillingPeriod
      summary: Issue one immutable invoice per billable student
      parameters:
        - $ref: "#/components/parameters/BillingYear"
        - $ref: "#/components/parameters/BillingMonth"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueBillingRequest"
      responses:
        "200":
          description: The existing run returned for a retry
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRun"
        "201":
          description: The new run and every immutable invoice
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ProjectionUnavailable"

  /api/home:
    get:
      operationId: getHome
      summary: The tutor and today's teaching work
      parameters:
        - $ref: "#/components/parameters/HomeCursor"
      responses:
        "200":
          description: Required identity and teaching facts plus optional billing progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/home/billing-projection:
    get:
      operationId: getHomeBillingProjection
      summary: Refresh only billing projection progress
      responses:
        "200":
          description: Billing progress or its isolated unavailable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeBillingProjection"
        "401":
          $ref: "#/components/responses/Unauthenticated"

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One browser generated UUID, retained until this create step succeeds.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ClassId:
      name: class_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BillingYear:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
    BillingMonth:
      name: month
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 12
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentQuery:
      name: q
      in: query
      required: false
      description: Case insensitive name or literal phone fragment, trimmed by teaching.
      schema:
        type: string
        maxLength: 160
    StudentCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the trimmed student search.
      schema:
        type: string
    RosterDate:
      name: date
      in: query
      required: false
      description: Local roster date. Teaching defaults it from verified token timezone claims.
      schema:
        type: string
        format: date
    HomeCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to the current tutor local date.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An Ed25519 signed access token, verified locally by each service (INV-14).

  responses:
    BadRequest:
      description: The request was not acceptable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: No valid token was supplied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The browser origin may not change this session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No owned resource matched
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The requested state conflicts with committed state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: The request shape is valid but one or more profile fields are invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The owning service could not complete the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: A required service did not answer successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many authentication requests reached an applicable budget
      headers:
        Retry-After:
          required: true
          description: Whole seconds until every applicable rate budget can admit one request.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          required: true
          description: Prevents a refusal from being stored by browsers or intermediaries.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProjectionUnavailable:
      description: The projection cannot yet prove the requested published cut
      headers:
        Retry-After:
          required: false
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: The one error shape at the gateway boundary (spec 0001).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              examples: ["invalid_input"]
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string

    Readiness:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string

    Session:
      type: object
      description: |
        What the browser holds after a refresh: an access token in memory only,
        and when it stops being valid. The refresh token itself is never in a
        body, only in the HttpOnly cookie beside it (spec 0004).
      required: [access_token, access_expires_at]
      properties:
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time

    Tutor:
      type: object
      required: [tutor_id, email, display_name, timezone, language, created_at]
      properties:
        tutor_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        timezone:
          type: string
        language:
          type: string
          enum: [vi, en]
        created_at:
          type: string
          format: date-time

    ClassColor:
      type: string
      enum: [red, rose, orange, green, blue, yellow, violet]

    LocalTime:
      type: string
      pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$"
      examples: ["17:30"]

    FirstSessionInput:
      type: object
      required: [local_date, start_time, end_time]
      properties:
        local_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/LocalTime"
        end_time:
          $ref: "#/components/schemas/LocalTime"

    WeeklyScheduleSlotInput:
      type: object
      required: [weekday, start_time, end_time]
      properties:
        weekday:
          type: integer
          minimum: 1
          maximum: 7
        start_time:
          $ref: "#/components/schemas/LocalTime"
        end_time:
          $ref: "#/components/schemas/LocalTime"

    WeeklyScheduleInput:
      type: object
      required: [valid_from, valid_through, slots]
      properties:
        valid_from:
          type: string
          format: date
        valid_through:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/WeeklyScheduleSlotInput"

    CreateClassRequest:
      type: object
      description: Exactly one of first_session or schedule is required.
      required: [name, rate_amount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        color:
          oneOf:
            - $ref: "#/components/schemas/ClassColor"
            - type: "null"
        rate_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        first_session:
          $ref: "#/components/schemas/FirstSessionInput"
        schedule:
          $ref: "#/components/schemas/WeeklyScheduleInput"

    Class:
      type: object
      required:
        [class_id, name, color, rate_amount, currency, rate_effective_from, schedule_revision, rate_revision]
      properties:
        class_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/ClassColor"
        rate_amount:
          type: integer
          format: int64
        currency:
          type: string
          const: VND
        rate_effective_from:
          type: string
          format: date
        schedule_revision:
          type: integer
          format: int64
          minimum: 0
        rate_revision:
          type: integer
          format: int64
          minimum: 0

    TeachingSession:
      type: object
      required: [session_id, class_id, starts_at, ends_at, local_date]
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date

    CreateClassResponse:
      type: object
      required: [class, first_session, rule, candidate_count, created_count, adopted_count]
      properties:
        class:
          $ref: "#/components/schemas/Class"
        first_session:
          oneOf:
            - $ref: "#/components/schemas/TeachingSession"
            - type: "null"
        rule:
          oneOf:
            - $ref: "#/components/schemas/ScheduleRuleSummary"
            - type: "null"
        candidate_count:
          type: integer
          minimum: 0
        created_count:
          type: integer
          minimum: 0
        adopted_count:
          type: integer
          minimum: 0

    PutScheduleRequest:
      type: object
      required: [expected_revision, effective_from, valid_through, slots]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        effective_from:
          type: string
          format: date
        valid_through:
          type: string
          format: date
        slots:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/WeeklyScheduleSlotInput"

    PutScheduleResponse:
      type: object
      required:
        [class, rule, first_session, candidate_count, created_count, adopted_count, superseded_count, preserved_count]
      properties:
        class:
          $ref: "#/components/schemas/Class"
        rule:
          $ref: "#/components/schemas/ScheduleRuleSummary"
        first_session:
          oneOf:
            - $ref: "#/components/schemas/TeachingSession"
            - type: "null"
        candidate_count:
          type: integer
          minimum: 0
        created_count:
          type: integer
          minimum: 0
        adopted_count:
          type: integer
          minimum: 0
        superseded_count:
          type: integer
          minimum: 0
        preserved_count:
          type: integer
          minimum: 0

    EndScheduleRequest:
      type: object
      required: [expected_revision, last_date]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        last_date:
          type: string
          format: date

    EndScheduleResponse:
      type: object
      required: [class, rule, superseded_count, preserved_count]
      properties:
        class:
          $ref: "#/components/schemas/Class"
        rule:
          $ref: "#/components/schemas/ScheduleRuleSummary"
        superseded_count:
          type: integer
          minimum: 0
        preserved_count:
          type: integer
          minimum: 0

    SessionVersionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1

    MoveSessionRequest:
      type: object
      required: [expected_version, local_date, start_time, end_time]
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        local_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/LocalTime"
        end_time:
          $ref: "#/components/schemas/LocalTime"

    CanonicalSession:
      type: object
      required:
        [session_id, class_id, starts_at, ends_at, local_date, origin_local_date, schedule_rule_id, source_time_zone, display_time_zone, start_utc_offset, end_utc_offset, version, state, moved_at, cancelled_at, superseded_at, updated_at]
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
        origin_local_date:
          type: string
          format: date
        schedule_rule_id:
          type: [string, "null"]
          format: uuid
        source_time_zone:
          type: [string, "null"]
        display_time_zone:
          type: string
        start_utc_offset:
          type: string
          pattern: "^[+-][0-9]{2}:[0-9]{2}$"
        end_utc_offset:
          type: string
          pattern: "^[+-][0-9]{2}:[0-9]{2}$"
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/ScheduleSessionState"
        moved_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        superseded_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time

    ScheduleRuleState:
      type: string
      enum: [planned, active, completed, replaced, ended, retired]

    ScheduleRuleSummary:
      type: object
      required:
        [schedule_rule_id, class_id, revision, valid_from, valid_through, time_zone, state, slots, replaced_at, ended_at, retired_at]
      properties:
        schedule_rule_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        valid_from:
          type: string
          format: date
        valid_through:
          type: string
          format: date
        time_zone:
          type: string
        state:
          $ref: "#/components/schemas/ScheduleRuleState"
        slots:
          type: array
          items:
            $ref: "#/components/schemas/WeeklyScheduleSlotInput"
        replaced_at:
          type: [string, "null"]
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        retired_at:
          type: [string, "null"]
          format: date-time

    ScheduleClass:
      type: object
      required: [class_id, name, color, schedule_revision]
      properties:
        class_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/ClassColor"
        schedule_revision:
          type: integer
          format: int64
          minimum: 0

    ScheduleSessionState:
      type: string
      enum: [active, cancelled, replaced]

    ScheduleSession:
      type: object
      required:
        [session_id, class_id, class_name, class_color, class_archived, starts_at, ends_at, display_date, display_start, display_end, start_utc_offset, end_utc_offset, local_date, origin_local_date, schedule_rule_id, source_time_zone, version, state, moved_at, cancelled_at, superseded_at, updated_at]
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
        class_color:
          $ref: "#/components/schemas/ClassColor"
        class_archived:
          type: boolean
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        display_date:
          type: string
          format: date
        display_start:
          $ref: "#/components/schemas/LocalTime"
        display_end:
          $ref: "#/components/schemas/LocalTime"
        start_utc_offset:
          type: string
          pattern: "^[+-][0-9]{2}:[0-9]{2}$"
        end_utc_offset:
          type: string
          pattern: "^[+-][0-9]{2}:[0-9]{2}$"
        local_date:
          type: string
          format: date
        origin_local_date:
          type: string
          format: date
        schedule_rule_id:
          type: [string, "null"]
          format: uuid
        source_time_zone:
          type: [string, "null"]
        version:
          type: integer
          format: int64
          minimum: 1
        state:
          $ref: "#/components/schemas/ScheduleSessionState"
        moved_at:
          type: [string, "null"]
          format: date-time
        cancelled_at:
          type: [string, "null"]
          format: date-time
        superseded_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: string
          format: date-time

    Schedule:
      type: object
      required:
        [tutor_id, request_time_zone, from, through, classes, rules, sessions, replaced_history, next_history_cursor]
      properties:
        tutor_id:
          type: string
          format: uuid
        request_time_zone:
          type: string
        from:
          type: string
          format: date
        through:
          type: string
          format: date
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleClass"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRuleSummary"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSession"
        replaced_history:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSession"
        next_history_cursor:
          type: [string, "null"]

    CreateStudentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type: [string, "null"]
          maxLength: 40

    StudentRecord:
      type: object
      required: [student_id, name, phone, created_at, updated_at]
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StudentSummary:
      type: object
      required: [student_id, name, phone, active_class_count, updated_at]
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: [string, "null"]
        active_class_count:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time

    StudentPage:
      type: object
      required: [students, next_cursor]
      properties:
        students:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/StudentSummary"
        next_cursor:
          type: [string, "null"]

    StudentMembership:
      type: object
      required: [class_id, class_name, class_color, effective_from, effective_to, active]
      properties:
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
        class_color:
          $ref: "#/components/schemas/ClassColor"
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, "null"]
          format: date
        active:
          type: boolean

    StudentDetail:
      type: object
      required: [student, memberships]
      properties:
        student:
          $ref: "#/components/schemas/StudentRecord"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/StudentMembership"

    UpdateStudentRequest:
      type: object
      required: [expected_updated_at]
      minProperties: 2
      additionalProperties: false
      properties:
        expected_updated_at:
          type: string
          format: date-time
        name:
          type: string
          minLength: 1
          maxLength: 160
        phone:
          type: [string, "null"]
          maxLength: 40

    StudentChangedDetails:
      type: object
      required: [student_id, updated_at]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time

    ClassReference:
      type: object
      required: [class_id, name]
      additionalProperties: false
      properties:
        class_id:
          type: string
          format: uuid
        name:
          type: string

    ActiveMembershipDetails:
      type: object
      required: [classes]
      additionalProperties: false
      properties:
        classes:
          type: array
          items:
            $ref: "#/components/schemas/ClassReference"

    ClassSummary:
      type: object
      required: [class_id, name, color]
      additionalProperties: false
      properties:
        class_id:
          type: string
          format: uuid
        name:
          type: string
        color:
          $ref: "#/components/schemas/ClassColor"

    RosterStudent:
      type: object
      required: [student_id, name, phone, archived, effective_from, effective_to]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: [string, "null"]
        archived:
          type: boolean
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, "null"]
          format: date

    ClassRoster:
      type: object
      required: [class, resolved_date, students]
      additionalProperties: false
      properties:
        class:
          $ref: "#/components/schemas/ClassSummary"
        resolved_date:
          type: string
          format: date
        students:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/RosterStudent"

    ChangeRosterRequest:
      type: object
      required: [change_date, additions, removals]
      additionalProperties: false
      properties:
        change_date:
          type: string
          format: date
        additions:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid
        removals:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid

    RosterConflictStudent:
      type: object
      required: [student_id, name, archived, effective_from, effective_to]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        effective_from:
          type: string
          format: date
        effective_to:
          type: [string, "null"]
          format: date

    RosterConflictDetails:
      type: object
      required: [class, resolved_date, students]
      additionalProperties: false
      properties:
        class:
          $ref: "#/components/schemas/ClassSummary"
        resolved_date:
          type: string
          format: date
        students:
          type: array
          items:
            $ref: "#/components/schemas/RosterConflictStudent"

    AttendanceState:
      type: string
      enum: [Present, Absent]

    SessionSummary:
      type: object
      required: [session_id, class_id, class_name, class_color, starts_at, ends_at, local_date, state]
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
        class_color:
          $ref: "#/components/schemas/ClassColor"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
        state:
          type: string
          enum: [active, cancelled, replaced, class_archived]

    AttendanceStudent:
      type: object
      required: [student_id, name, archived, state, marked_at]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        archived:
          type: boolean
        state:
          oneOf:
            - $ref: "#/components/schemas/AttendanceState"
            - type: "null"
        marked_at:
          type: [string, "null"]
          format: date-time

    AttendanceSheet:
      type: object
      required: [session, eligible, ineligible_reason, revision, students]
      additionalProperties: false
      properties:
        session:
          $ref: "#/components/schemas/SessionSummary"
        eligible:
          type: boolean
        ineligible_reason:
          type: [string, "null"]
          enum: [replaced, cancelled, class_archived, not_started, null]
        revision:
          type: string
        students:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AttendanceStudent"

    AttendanceMarkInput:
      type: object
      required: [student_id, state]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/AttendanceState"

    SaveAttendanceRequest:
      type: object
      required: [revision, marks]
      additionalProperties: false
      properties:
        revision:
          type: string
          minLength: 1
        marks:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/AttendanceMarkInput"

    SavedAttendanceMark:
      type: object
      required: [student_id, state, marked_at]
      additionalProperties: false
      properties:
        student_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/AttendanceState"
        marked_at:
          type: string
          format: date-time

    AttendanceSave:
      type: object
      required: [session_id, marked_at, marks]
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        marked_at:
          type: string
          format: date-time
        marks:
          type: array
          items:
            $ref: "#/components/schemas/SavedAttendanceMark"

    AttendanceChangedDetails:
      type: object
      required: [sheet]
      additionalProperties: false
      properties:
        sheet:
          $ref: "#/components/schemas/AttendanceSheet"

    SessionNotEligibleDetails:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [replaced, cancelled, class_archived, not_started]

    SetupDefaults:
      type: object
      required: [local_date, start_time, end_time]
      properties:
        local_date:
          type: string
          format: date
        start_time:
          $ref: "#/components/schemas/LocalTime"
        end_time:
          $ref: "#/components/schemas/LocalTime"

    HomeStudent:
      type: object
      required: [student_id, name, attendance_state, marked_at]
      properties:
        student_id:
          type: string
          format: uuid
        name:
          type: string
        attendance_state:
          oneOf:
            - $ref: "#/components/schemas/AttendanceState"
            - type: "null"
        marked_at:
          type: [string, "null"]
          format: date-time

    HomeSession:
      type: object
      required:
        [session_id, class_id, class_name, class_color, starts_at, ends_at, local_date, students]
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: string
          format: uuid
        class_name:
          type: string
        class_color:
          $ref: "#/components/schemas/ClassColor"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        local_date:
          type: string
          format: date
        students:
          type: array
          items:
            $ref: "#/components/schemas/HomeStudent"

    TeachingHome:
      type: object
      required:
        [request_time_zone, local_date, next_local_midnight_at, setup_defaults, sessions, next_cursor]
      properties:
        request_time_zone:
          type: string
        local_date:
          type: string
          format: date
        next_local_midnight_at:
          type: string
          format: date-time
        setup_defaults:
          $ref: "#/components/schemas/SetupDefaults"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/HomeSession"
        next_cursor:
          type: [string, "null"]

    BillingProjection:
      type: object
      required:
        [state, class_count, session_count, student_count, open_roster_count, attendance_count, latest_updated_at]
      properties:
        state:
          type: string
          enum: [waiting, active]
        class_count:
          type: integer
          format: int64
          minimum: 0
        session_count:
          type: integer
          format: int64
          minimum: 0
        student_count:
          type: integer
          format: int64
          minimum: 0
        open_roster_count:
          type: integer
          format: int64
          minimum: 0
        attendance_count:
          type: integer
          format: int64
          minimum: 0
        latest_updated_at:
          type: [string, "null"]
          format: date-time

    InvoiceProfile:
      type: object
      additionalProperties: false
      required:
        [legal_name, contact_line, bank_code, bank_name, bank_account_number, bank_account_holder, revision, is_complete, missing_fields, bank_status]
      properties:
        legal_name:
          type: [string, "null"]
        contact_line:
          type: [string, "null"]
        bank_code:
          type: [string, "null"]
        bank_name:
          type: [string, "null"]
        bank_account_number:
          type: [string, "null"]
        bank_account_holder:
          type: [string, "null"]
        revision:
          type: integer
          format: int64
          minimum: 0
        is_complete:
          type: boolean
        missing_fields:
          type: array
          items:
            type: string
            enum: [legal_name, contact_line, bank_code, bank_account_number, bank_account_holder]
        bank_status:
          type: string
          enum: [missing, active, inactive]

    PutInvoiceProfileRequest:
      type: object
      additionalProperties: false
      required:
        [expected_revision, legal_name, contact_line, bank_code, bank_account_number, bank_account_holder]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        legal_name:
          type: [string, "null"]
          maxLength: 120
        contact_line:
          type: [string, "null"]
          maxLength: 200
        bank_code:
          type: [string, "null"]
        bank_account_number:
          type: [string, "null"]
        bank_account_holder:
          type: [string, "null"]
          maxLength: 120

    Bank:
      type: object
      additionalProperties: false
      required: [code, short_name, official_name]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
        short_name:
          type: string
        official_name:
          type: string

    BankCatalog:
      type: object
      additionalProperties: false
      required: [banks]
      properties:
        banks:
          type: array
          items:
            $ref: "#/components/schemas/Bank"

    RateCurrent:
      type: object
      additionalProperties: false
      required: [rate_amount, currency, effective_from, rate_revision]
      properties:
        rate_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        currency:
          type: string
          const: VND
        effective_from:
          type: string
          format: date
        rate_revision:
          type: integer
          format: int64
          minimum: 0

    RateAllowedRange:
      type: object
      additionalProperties: false
      required: [from, through]
      properties:
        from:
          type: string
          format: date
        through:
          type: string
          format: date

    ProjectedClassRate:
      type: object
      additionalProperties: false
      required: [effective_from, rate_amount, currency, rate_revision]
      properties:
        effective_from:
          type: string
          format: date
        rate_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
        currency:
          type: string
          const: VND
        rate_revision:
          type: integer
          format: int64
          minimum: 0

    ClassRates:
      type: object
      additionalProperties: false
      required: [class_id, current, allowed_range, archived, rates, projected_revision, history_state]
      properties:
        class_id:
          type: string
          format: uuid
        current:
          $ref: "#/components/schemas/RateCurrent"
        allowed_range:
          $ref: "#/components/schemas/RateAllowedRange"
        archived:
          type: boolean
        rates:
          type: array
          items:
            $ref: "#/components/schemas/ProjectedClassRate"
        projected_revision:
          type: integer
          format: int64
          minimum: 0
        history_state:
          type: string
          enum: [synced, syncing, unavailable]

    PutClassRateRequest:
      type: object
      additionalProperties: false
      required: [rate_amount]
      properties:
        rate_amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000

    PutClassRateResponse:
      type: object
      additionalProperties: false
      required:
        [class_id, effective_from, rate_amount, currency, rate_revision, current, allowed_range, issued_invoices_unchanged, history_state]
      properties:
        class_id:
          type: string
          format: uuid
        effective_from:
          type: string
          format: date
        rate_amount:
          type: integer
          format: int64
        currency:
          type: string
          const: VND
        rate_revision:
          type: integer
          format: int64
          minimum: 1
        current:
          $ref: "#/components/schemas/RateCurrent"
        allowed_range:
          $ref: "#/components/schemas/RateAllowedRange"
        issued_invoices_unchanged:
          type: boolean
          const: true
        history_state:
          type: string
          const: pending

    BillingPeriod:
      type: object
      additionalProperties: false
      required: [year, month]
      properties:
        year:
          type: integer
          minimum: 2000
        month:
          type: integer
          minimum: 1
          maximum: 12

    BillingPeriodDefault:
      type: object
      additionalProperties: false
      required: [server_date, timezone, year, month, minimum_year]
      properties:
        server_date:
          type: string
          format: date
        timezone:
          type: string
        year:
          type: integer
          minimum: 2000
        month:
          type: integer
          minimum: 1
          maximum: 12
        minimum_year:
          type: integer
          const: 2000

    BillingRecoveryDestination:
      type: object
      additionalProperties: false
      required: [route, date, session_id, class_id, rate_date]
      properties:
        route:
          type: string
        date:
          type: [string, "null"]
          format: date
        session_id:
          type: [string, "null"]
          format: uuid
        class_id:
          type: [string, "null"]
          format: uuid
        rate_date:
          type: [string, "null"]
          format: date

    BillingBlocker:
      type: object
      additionalProperties: false
      required: [code, student_id, session_id, class_id, local_date, field, destination]
      properties:
        code:
          type: string
          enum: [profile_incomplete, attendance_incomplete, rate_missing]
        student_id:
          type: [string, "null"]
          format: uuid
        session_id:
          type: [string, "null"]
          format: uuid
        class_id:
          type: [string, "null"]
          format: uuid
        local_date:
          type: [string, "null"]
          format: date
        field:
          type: [string, "null"]
        destination:
          $ref: "#/components/schemas/BillingRecoveryDestination"

    BillingLine:
      type: object
      additionalProperties: false
      required: [session_id, class_id, class_name, local_date, rate_amount, amount, currency]
      properties:
        session_id:
          type: string
          format: uuid
        class_id:
          type: [string, "null"]
          format: uuid
        class_name:
          type: string
        local_date:
          type: string
          format: date
        rate_amount:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        currency:
          type: string
          const: VND

    BillingStudentTotal:
      type: object
      additionalProperties: false
      required: [student_id, student_name, lines, total_amount, currency]
      properties:
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BillingLine"
        total_amount:
          type: integer
          format: int64
        currency:
          type: string
          const: VND

    IssuedInvoice:
      type: object
      additionalProperties: false
      required:
        [invoice_id, student_id, student_name, invoice_number, total_amount, currency, issued_at, lines]
      properties:
        invoice_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        invoice_number:
          type: string
        total_amount:
          type: integer
          format: int64
        currency:
          type: string
          const: VND
        issued_at:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BillingLine"

    BillingRun:
      type: object
      additionalProperties: false
      required: [billing_run_id, period, generation, created_at, invoices, grand_total, currency]
      properties:
        billing_run_id:
          type: string
          format: uuid
        period:
          $ref: "#/components/schemas/BillingPeriod"
        generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/IssuedInvoice"
        grand_total:
          type: integer
          format: int64
        currency:
          type: string
          const: VND

    BillingPeriodState:
      type: object
      additionalProperties: false
      required: [status, period, run]
      properties:
        status:
          type: string
          enum: [unissued, already_issued]
        period:
          $ref: "#/components/schemas/BillingPeriod"
        run:
          oneOf:
            - $ref: "#/components/schemas/BillingRun"
            - type: "null"

    BillingPreview:
      type: object
      additionalProperties: false
      required: [status, period, students, blockers, grand_total, currency, preview_fingerprint, run]
      properties:
        status:
          type: string
          enum: [ready, blocked, empty, already_issued]
        period:
          $ref: "#/components/schemas/BillingPeriod"
        students:
          type: array
          items:
            $ref: "#/components/schemas/BillingStudentTotal"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/BillingBlocker"
        grand_total:
          type: integer
          format: int64
        currency:
          type: string
          const: VND
        preview_fingerprint:
          type: [string, "null"]
        run:
          oneOf:
            - $ref: "#/components/schemas/BillingRun"
            - type: "null"

    IssueBillingRequest:
      type: object
      additionalProperties: false
      required: [preview_fingerprint]
      properties:
        preview_fingerprint:
          type: string
          minLength: 1

    HomeBillingProjection:
      type: object
      required: [billing_projection, billing_projection_unavailable]
      properties:
        billing_projection:
          oneOf:
            - $ref: "#/components/schemas/BillingProjection"
            - type: "null"
        billing_projection_unavailable:
          type: [string, "null"]

    Home:
      allOf:
        - $ref: "#/components/schemas/TeachingHome"
        - type: object
          required: [tutor, billing_projection, billing_projection_unavailable]
          properties:
            tutor:
              $ref: "#/components/schemas/Tutor"
            billing_projection:
              oneOf:
                - $ref: "#/components/schemas/BillingProjection"
                - type: "null"
            billing_projection_unavailable:
              type: [string, "null"]

security:
  - bearerAuth: []
